<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Simple Login</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #eef2ff, #c7d2fe, #ddd6fe);
      color: #1f2937;
    }

    .login-card {
      width: 100%;
      max-width: 380px;
      padding: 32px 28px;
      background: rgba(255, 255, 255, 0.95);
      border-radius: 16px;
      box-shadow: 0 20px 45px rgba(79, 70, 229, 0.15);
    }

    h1 {
      margin: 0 0 8px;
      text-align: center;
      font-size: 2rem;
      color: #312e81;
    }

    .subtitle {
      margin: 0 0 24px;
      text-align: center;
      color: #6b7280;
      font-size: 0.95rem;
    }

    .field {
      margin-bottom: 18px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-size: 0.9rem;
      font-weight: 600;
      color: #374151;
    }

    input {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    input:focus {
      border-color: #6366f1;
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15);
    }

    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 8px 0 20px;
      font-size: 0.9rem;
      color: #4b5563;
    }

    .row a {
      color: #4f46e5;
      text-decoration: none;
    }

    .login-btn {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 10px;
      background: linear-gradient(135deg, #4f46e5, #7c3aed);
      color: #fff;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: opacity 0.2s ease;
    }

    .login-btn:hover {
      opacity: 0.95;
    }

    .signup {
      margin-top: 18px;
      text-align: center;
      color: #4b5563;
      font-size: 0.92rem;
    }

    .signup a {
      color: #4f46e5;
      text-decoration: none;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="login-card">
    <h1>Login</h1>
    <p class="subtitle">Welcome back! Please sign in.</p>

    <form>
      <div class="field">
        <label for="email">Email</label>
        <input id="email" type="email" placeholder="Enter your email" />
      </div>

      <div class="field">
        <label for="password">Password</label>
        <input id="password" type="password" placeholder="Enter your password" />
      </div>

      <div class="row">
        <label><input type="checkbox" /> Remember me</label>
        <a href="#">Forgot password?</a>
      </div>

      <button type="submit" class="login-btn">Sign In</button>

      <p class="signup">Don't have an account? <a href="#">Sign up</a></p>
    </form>
  </div>
</body>
</html>
