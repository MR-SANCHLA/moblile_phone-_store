<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>forget</title>
</head>
<body>
    
 <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #667eea, #764ba2);
        }

        .forgot-box {
            width: 350px;
            padding: 40px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            text-align: center;
        }

        .forgot-box h2 {
            color: #667eea;
            margin-bottom: 15px;
        }

        .forgot-box p {
            color: #777;
            margin-bottom: 25px;
        }

        .forgot-box input {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            outline: none;
            margin-bottom: 15px;
        }

        .forgot-box input:focus {
            border-color: #667eea;
        }

        .reset-btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            color: white;
            background: linear-gradient(90deg, #667eea, #764ba2);
            cursor: pointer;
            font-size: 16px;
        }

        .back-login {
            display: block;
            margin-top: 20px;
            color: #667eea;
            text-decoration: none;
        }
    </style>
</head>

<body>

    <div class="forgot-box">
        <h2>Forgot Password?</h2>

        <p>Enter your email to reset your password.</p>

        <input type="number" placeholder="Enter your phone number">

        <button class="btn btn-primary">enter OTP</button>

        <a href="login.html" class="back-login">
            ← Back to Login
        </a>
    </div>

</body>
</html>
